# Motion, gripper, mock execution, and teleoperation control parameters

motion:
  default_velocity: 60.0
  default_acceleration: 60.0
  arrival_tolerance_mm: 15.0
  arrival_angle_tolerance_deg: 10.0
  slow_velocity: 30.0
  slow_acceleration: 30.0
  dry_run: false
  # Vision B sends Z_surface (mm); Robot subtracts category grasp_depth_offset_mm and clamps to z_min_mm
  apply_grasp_depth_offset: true

reorient:
  gentle_tilt_deg: 40.0
  flip_lift_delta_mm: 90.0
  release_clearance_mm: 55.0
  edge_offset_mm: 35.0
  pivot_lift_mm: 70.0
  pivot_tilt_deg: 35.0
  drag_forward_mm: 55.0
  release_z_offset_mm: 25.0
  back_tilt_deg: 30.0
  vertical_mid_tilt_deg: 0.0
  vertical_fwd_tilt_deg: 45.0
  vertical_edge_offset_mm: 65.0
  vertical_mid_y_offset_mm: 0.0
  vertical_sweep_y_mm: 145.0
  vertical_lift_delta_mm: 165.0
  vertical_mid_z_delta_mm: 145.0
  vertical_release_z_delta_mm: 115.0

gripper:
  type: "rg2"
  ip: "192.168.1.1"
  port: 502
  wait_after_move_sec: 0.6

health:
  heartbeat_period_sec: 1.0

mock_robot:
  step_delay_sec: 0.15
  publish_feedback_steps: 4

blackbox:
  log_dir: "data/logs"
  enabled: true

teleop:
  ema_alpha: 0.3
  deadzone_px: 15.0
  gripper_debounce_sec: 0.5
  watchdog_timeout_sec: 0.5
  px_to_mm_scale: 0.25
  max_step_mm: 15.0
  min_move_mm: 1.0
  control_rate_hz: 10.0
  gripper_open_width_mm: 90.0
  gripper_close_width_mm: 20.0
  gripper_force_n: 18.0
