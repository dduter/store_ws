# Product catalog & robot grasping parameters (OnRobot RG2)
# Orchestrator (LLM) passes product_category; executor_node (Robot) resolves
# open_width_mm (approach/release), grasp_width_mm (target closing width),
# grasp_force_n, and grasp_depth_offset_mm via grasp_planner.py.
#
# RG2 hardware note:
#   grasp_width_mm MUST be smaller than the physical product width so the fingers
#   contact the product and stop by force control (grip_detected=True).
#   open_width_mm MUST be wider than the product width for clean approach/release.

defaults:
  grasp_width_mm: 20.0
  open_width_mm: 90.0
  open_margin_mm: 20.0
  grasp_force_n: 18.0
  grasp_depth_offset_mm: 15.0
  reorient_mode: "edge_pivot_flip"

# Physical gripper limits (OnRobot RG2)
rg2_limits:
  min_width_mm: 0.0
  max_width_mm: 110.0
  min_force_n: 3.0
  max_force_n: 40.0

# 3 Core Product Categories + 1 Special Task Category
categories:
  paper_box:
    display_name: "종이상자"
    grasp_width_mm: 20.0
    open_width_mm: 95.0
    grasp_force_n: 20.0
    grasp_depth_offset_mm: 18.0
    reorient_mode: "edge_pivot_flip"
  snack_bag:
    display_name: "봉지과자"
    grasp_width_mm: 15.0
    open_width_mm: 95.0
    grasp_force_n: 12.0
    grasp_depth_offset_mm: 15.0
    reorient_mode: "edge_pivot_flip"
  candy_chocolate:
    display_name: "캔디·초콜릿류"
    grasp_width_mm: 10.0
    open_width_mm: 75.0
    grasp_force_n: 15.0
    grasp_depth_offset_mm: 12.0
    reorient_mode: "edge_pivot_flip"
  # Special non-retail task category
  cigarette_mock:
    display_name: "모형 담배 (후순위 원격)"
    grasp_width_mm: 15.0
    open_width_mm: 80.0
    grasp_force_n: 15.0
    grasp_depth_offset_mm: 15.0
    reorient_mode: "none"

# Optional per-product overrides (keyed by yolo_class after products are finalized).
# Example:
# products:
#   choco_pie:
#     category: "paper_box"
#     grasp_width_mm: 25.0
#     open_width_mm: 100.0
#     grasp_force_n: 18.0
products:
  # 실측: 88 x 162 mm (실물 180° 반전 성공 확정값: 3.0N / 84.0mm 중력 힌지)
  pepero_almond:
    category: "paper_box"
    reorient_mode: "back_tilt_vertical_flip"
    vertical_edge_offset_mm: 65.0
    open_width_mm: 108.0
    grasp_width_mm: 84.0
    grasp_force_n: 3.0
    grasp_depth_offset_mm: 15.0
  # 실측: 가로 150 mm(±X) x 세로 230 mm(±Y) (실물 180° 반전 확정값: 45° 수평 두 손가락 + 50° 팔 기울기 파지 -> Z=290 들기 -> J4(-36.6°, ry=-120°) +Y 넘기기)
  postick:
    category: "snack_bag"
    reorient_mode: "back_tilt_vertical_flip"
    vertical_entry_axis: "x"
    vertical_entry_yaw_deg: -45.0
    vertical_edge_offset_mm: 114.0
    vertical_corner_x_offset_mm: 75.0
    vertical_slide_in_y_mm: 0.0
    vertical_back_tilt_deg: 50.0
    vertical_fwd_tilt_deg: 60.0
    vertical_sweep_mm: 180.0
    vertical_tilt_sign: -1
    vertical_fwd_tilt_sign: -1
    vertical_j6_offset_deg: 0.0
    vertical_lift_delta_mm: 110.0
    vertical_mid_z_delta_mm: 275.0
    vertical_release_z_delta_mm: 125.0
    open_width_mm: 70.0
    grasp_width_mm: 0.0
    grasp_force_n: 18.0
    grasp_depth_offset_mm: 15.0
    pick_offset_x_mm: 75.0
    pick_offset_y_mm: -114.0
    pick_yaw_offset_deg: -45.0
    pick_transit_z_mm: 260.0
    place_z_offset_mm: 95.0
  # 알로에농장 등 원통 음료 (변경 가능, 실측 후 지름/힘 보정 예정)
  drink:
    category: "paper_box"
    reorient_mode: "in_place_yaw_180"
    open_width_mm: 95.0
    grasp_width_mm: 45.0
    grasp_force_n: 30.0
    grasp_depth_offset_mm: 25.0

# 비전 YOLO 확정 클래스명 <-> 카탈로그 정규 키 별칭 매핑
aliases:
  pepero_almond_front: "pepero_almond"
  postick_front: "postick"
  drink_front: "drink"
  ciga: "cigarette_mock"
