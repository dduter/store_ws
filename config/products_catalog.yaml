# Product catalog & robot grasping parameters (OnRobot RG2)
# Orchestrator (LLM) passes product_category (specific product key: pepero_almond, postick, drink, ciga);
# executor_node (Robot) resolves open_width_mm, grasp_width_mm, grasp_force_n,
# grasp_depth_offset_mm, and reorient_mode via grasp_planner.py.
#
# RG2 hardware note:
#   grasp_width_mm MUST be smaller than the physical product width so the fingers
#   contact the product and stop by force control (grip_detected=True).
#   open_width_mm MUST be wider than the product width for clean approach/release.

defaults:
  grasp_width_mm: 20.0
  open_width_mm: 90.0
  open_margin_mm: 20.0
  grasp_force_n: 18.0
  grasp_depth_offset_mm: 15.0
  reorient_mode: "edge_pivot_flip"

# Physical gripper limits (OnRobot RG2)
rg2_limits:
  min_width_mm: 0.0
  max_width_mm: 110.0
  min_force_n: 3.0
  max_force_n: 40.0

# Product Categories + Special Task Category (로봇 단위테스트 및 폴백 호환 유지)
categories:
  paper_box:
    display_name: "종이상자"
    grasp_width_mm: 20.0
    open_width_mm: 95.0
    grasp_force_n: 20.0
    grasp_depth_offset_mm: 18.0
    reorient_mode: "edge_pivot_flip"
  snack_bag:
    display_name: "봉지과자"
    grasp_width_mm: 15.0
    open_width_mm: 95.0
    grasp_force_n: 12.0
    grasp_depth_offset_mm: 15.0
    reorient_mode: "edge_pivot_flip"
  bottle:
    display_name: "병음료"
    grasp_width_mm: 20.0
    open_width_mm: 95.0
    grasp_force_n: 22.0
    grasp_depth_offset_mm: 25.0
    reorient_mode: "edge_pivot_flip"
  candy_chocolate:
    display_name: "캔디·초콜릿류"
    grasp_width_mm: 10.0
    open_width_mm: 75.0
    grasp_force_n: 15.0
    grasp_depth_offset_mm: 12.0
    reorient_mode: "edge_pivot_flip"
  # Special non-retail task category (ciga + cigarette_mock 호환 유지)
  ciga:
    display_name: "모형 담배 (후순위 원격)"
    grasp_width_mm: 15.0
    open_width_mm: 80.0
    grasp_force_n: 15.0
    grasp_depth_offset_mm: 15.0
    reorient_mode: "none"
  cigarette_mock:
    display_name: "모형 담배 (후순위 원격)"
    grasp_width_mm: 15.0
    open_width_mm: 80.0
    grasp_force_n: 15.0
    grasp_depth_offset_mm: 15.0
    reorient_mode: "none"

# 확정 YOLO 클래스명 (비전 파트 최종 확정):
#   상품 앞면 3종: postick_front, pepero_almond_front, drink_front (각 3개 실물 = 총 9개)
#   공통 뒷면: product_back
#   후순위 원격 전용: ciga
#   웹캠 형광조끼(비전→LLM /store/vision/vest_detected, 로봇 파지 필터링 대상): vest
# 로봇 파트 키 규칙: products 키(pepero_almond, postick, drink, ciga)를 ExecuteRobotTask.product_category로 전달
products:
  # 실측: 88 x 162 mm (실물 180° 반전 성공 확정값: 3.0N / 84.0mm 중력 힌지)
  pepero_almond:
    yolo_class: "pepero_almond_front"
    name: "아몬드 빼빼로"
    aliases: ["빼빼로", "pepero", "pepero_front", "almond_pepero_front", "pepero_almond_front"]
    category: "paper_box"
    display_category: "종이상자"
    ontology_class: "BoxSnack"
    brand: "롯데"
    color: "초록"
    taste: "단맛(초콜릿, 아몬드)"
    size_mm: 88.0
    sweetness_rank: 3
    requires_remote_auth: false
    reorient_mode: "back_tilt_vertical_flip"
    vertical_edge_offset_mm: 65.0
    open_width_mm: 108.0
    grasp_width_mm: 84.0
    grasp_force_n: 3.0
    grasp_depth_offset_mm: 15.0

  # 실측: 가로 150 mm(추정) x 세로 225~235 mm (RG2 최대 폭 110 mm이므로 세워 잡기/중앙·모서리 집기 기준, 두께 실측 후 보정)
  postick:
    yolo_class: "postick_front"
    name: "포스틱"
    aliases: ["postick", "postick_front"]
    category: "snack_bag"
    display_category: "봉지과자"
    ontology_class: "BagSnack"
    brand: "농심"
    color: "파랑"
    taste: "짠맛(감자)"
    size_mm: 150.0
    sweetness_rank: 1
    requires_remote_auth: false
    open_width_mm: 110.0
    grasp_width_mm: 20.0
    grasp_force_n: 12.0
    grasp_depth_offset_mm: 25.0

  drink:
    yolo_class: "drink_front"
    name: "병음료"
    aliases: ["bottle", "bottle_front", "drink_front", "음료", "음료수"]
    category: "bottle"
    display_category: "병음료"
    ontology_class: "Beverage"
    brand: "미정"
    color: "미정"
    taste: "미정"
    size_mm: 0.0  # [실측 후 기입]
    sweetness_rank: 2
    requires_remote_auth: false

  ciga:
    yolo_class: "ciga"
    name: "모형 담배"
    aliases: ["ciga_front", "cigarette_mock", "ciga"]
    category: "ciga"
    display_category: "담배"
    ontology_class: "Tobacco"
    brand: "기타"
    color: "하양"
    taste: "무맛"
    requires_remote_auth: true
