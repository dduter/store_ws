# Product catalog & robot grasping parameters (OnRobot RG2)
# Orchestrator (LLM) passes product_category; executor_node (Robot) resolves
# open_width_mm (approach/release), grasp_width_mm (target closing width),
# grasp_force_n, and grasp_depth_offset_mm via grasp_planner.py.
#
# RG2 hardware note:
#   grasp_width_mm MUST be smaller than the physical product width so the fingers
#   contact the product and stop by force control (grip_detected=True).
#   open_width_mm MUST be wider than the product width for clean approach/release.

defaults:
  grasp_width_mm: 20.0
  open_width_mm: 90.0
  open_margin_mm: 20.0
  grasp_force_n: 18.0
  grasp_depth_offset_mm: 15.0
  reorient_mode: "flip_180_in_place"

# Physical gripper limits (OnRobot RG2)
rg2_limits:
  min_width_mm: 0.0
  max_width_mm: 110.0
  min_force_n: 3.0
  max_force_n: 40.0

